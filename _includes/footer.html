<footer class="site-footer">
  <div class="container footer-inner">
    <div class="footer-left">
      <span class="footer-brand">{{ site.title }}</span>
      <span class="footer-sep">·</span>
      <span>MIT licensed</span>
      <span class="footer-sep">·</span>
      <span>&copy; {{ 'now' | date: "%Y" }} {{ site.author.name }}</span>
    </div>
    <div class="footer-right">
      <a href="https://github.com/{{ site.repository }}" target="_blank" rel="noopener">GitHub</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
      <a href="{{ '/contributing/' | relative_url }}">Contributing</a>
    </div>
  </div>
</footer>
